name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      COLUMNS: "250"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy --strict)
        run: python -m mypy
      - name: Spec schema is current
        run: python scripts/export_schema.py --check
      - name: Tests with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - name: Same output with different hash seeds
        if: matrix.os == 'ubuntu-latest'
        run: |
          PYTHONHASHSEED=0 agenticreq audit tests/fixtures -f json --fail-on never > a.json
          PYTHONHASHSEED=4242 agenticreq audit tests/fixtures -f json --fail-on never > b.json
          cmp a.json b.json
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    name: build, check and install the wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: twine check
        run: twine check --strict dist/*
      - name: Install the wheel in a fresh venv and smoke test it
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/agenticreq" --help
          "$RUNNER_TEMP/smoke/bin/agenticreq" version
          "$RUNNER_TEMP/smoke/bin/agenticreq" check "$GITHUB_WORKSPACE/tests/fixtures/passfail/clean" \
            --spec "$GITHUB_WORKSPACE/tests/fixtures/passfail/clean/spec.yml" --fail-on never
      - name: Audit the wheel's dependencies (pip-audit)
        run: |
          "$RUNNER_TEMP/smoke/bin/python" -m pip freeze --exclude agenticreq > "$RUNNER_TEMP/runtime-requirements.txt"
          python -m pip install pip-audit
          pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
