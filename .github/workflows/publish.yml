name: Publish to PyPI

# Publishing a GitHub Release (created from a version tag) uploads to PyPI.
# No API token is stored anywhere: PyPI Trusted Publishing (OIDC) authorises the upload.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/agenticreq/__init__.py').read_text()).group(1))")"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != version v${version}"; exit 1; }
      - name: Build once
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agenticreq
    permissions:
      id-token: write   # Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
