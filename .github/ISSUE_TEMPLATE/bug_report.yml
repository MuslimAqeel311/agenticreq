name: Bug report
description: agenticreq gave a wrong result, crashed, or behaved differently from the docs.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got. Paste the output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest way to reproduce
      description: A few lines of agent code and the spec.yml fields involved. Remove secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agenticreq version
      placeholder: "agenticreq version"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and OS
      placeholder: "3.12 on macOS 14"
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Agent framework and version (if relevant)
      placeholder: "openai-agents 0.3"
