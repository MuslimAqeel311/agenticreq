# Framework versions agenticreq was validated on end to end (the agent ran under the canned responder and
# its captures were checked). `discover` refuses only a `known_bad` version; any other version outside the
# range runs with a note (the capture hooks the HTTP client, not the framework, and a run that captures
# nothing exits 1). `audit` / `check` report AS-908 when the agent's version (its own environment, lock
# file or exact pin) is outside the range, or when its declared range allows no validated version.
# Frameworks not listed here are not gated. To add a version: validation/val_frameworks.py, then `validated:`.
frameworks:
  crewai:
    dist: crewai
    min: "1.9.3"
    below: "2"
    validated: ["1.9.3", "1.15.28"]
    known_bad: {"0.86": "the mock run hangs until --timeout, then the run dies"}
  langgraph:
    dist: langgraph
    min: "1.2"
    below: "2"
    validated: ["1.2.15", "1.2.17"]
  openai-agents:
    dist: openai-agents
    min: "0.23"
    below: "1"
    validated: ["0.23.1", "0.24.0"]
