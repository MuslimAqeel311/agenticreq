# Tools frameworks put on the wire that do not appear in user code.
# They are NOT reported as undeclared (AS-202). Add new frameworks here.
# Names are compared after canonicalisation (lowercase, non-alnum -> "_"),
# so "Delegate work to coworker" matches delegate_work_to_coworker.
version: 1
frameworks:
  crewai:
    exact: [delegate_work_to_coworker, ask_question_to_coworker]
    note: CrewAI renames "Delegate work to coworker" -> snake_case on the wire when allow_delegation=True
  openai-agents:
    prefix: [transfer_to_]
    note: handoff tools generated from Agent(handoffs=[...])
  smolagents:
    exact: [final_answer]
  langgraph:
    prefix: [transfer_to_, transfer_back_to_]
    note: langgraph-supervisor / swarm handoff tools
  google-adk:
    exact: [transfer_to_agent]
    note: LlmAgent(sub_agents=[...]) lets the model call transfer_to_agent(agent_name=...)
  llamaindex:
    exact: [handoff]
    note: AgentWorkflow(agents=[...]) adds handoff(to_agent=..., reason=...) to every agent
  autogen:
    prefix: [transfer_to_]
    note: Swarm handoffs=["x"] become transfer_to_x tools
  pydantic-ai:
    exact: [final_result]
    prefix: [final_result_]
    note: structured-output tool when output_type is set
  claude-agent-sdk:
    note: built-in tools, allowed by name in allowed_tools= / tools=; they run in the SDK's own process
    # capability: what the tool can do, so `prohibited` and `role_boundary` can name the ability and not the spelling
    builtin:
      Read: {effect: read}
      Glob: {effect: read}
      Grep: {effect: read}
      WebFetch: {effect: read}
      WebSearch: {effect: read}
      ListMcpResources: {effect: read}
      ReadMcpResource: {effect: read}
      TodoWrite: {effect: read}
      Task: {effect: read}
      Skill: {effect: read}
      SlashCommand: {effect: read}
      ExitPlanMode: {effect: read}
      Write: {effect: write, capability: file_write}
      Edit: {effect: write, capability: file_write}
      MultiEdit: {effect: write, capability: file_write}
      NotebookEdit: {effect: write, capability: file_write}
      Bash: {effect: write, capability: shell_execution}
      BashOutput: {effect: read}
      KillShell: {effect: write, capability: shell_execution}
# the words a spec may use for a capability
capability_names:
  shell_execution: shell_execution
  shell: shell_execution
  run_shell: shell_execution
  command_execution: shell_execution
  file_write: file_write
  file_writes: file_write
  write_files: file_write
