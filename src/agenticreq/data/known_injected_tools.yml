# Tools frameworks put on the wire that do not appear in user code.
# They are NOT reported as undeclared (AS-202). Add new frameworks here.
# Names are compared after canonicalisation (lowercase, non-alnum -> "_"),
# so "Delegate work to coworker" matches delegate_work_to_coworker.
version: 1
frameworks:
  crewai:
    exact: [delegate_work_to_coworker, ask_question_to_coworker]
    note: CrewAI renames "Delegate work to coworker" -> snake_case on the wire when allow_delegation=True
  openai-agents:
    prefix: [transfer_to_]
    note: handoff tools generated from Agent(handoffs=[...])
  smolagents:
    exact: [final_answer]
  langgraph:
    prefix: [transfer_to_, transfer_back_to_]
    note: langgraph-supervisor / swarm handoff tools
  google-adk:
    exact: [transfer_to_agent, set_model_response]
    note: LlmAgent(sub_agents=[...]) lets the model call transfer_to_agent(agent_name=...); output_schema= with tools
      adds set_model_response, the tool the model answers through
  llamaindex:
    exact: [handoff]
    note: AgentWorkflow(agents=[...]) adds handoff(to_agent=..., reason=...) to every agent
  autogen:
    prefix: [transfer_to_]
    note: Swarm handoffs=["x"] become transfer_to_x tools
  dspy:
    exact: [submit, finish]
    note: dspy.ReAct adds the tool the model ends with (finish in older releases, submit in newer)
  agno:
    exact: [delegate_task_to_member, delegate_task_to_members, transfer_task_to_member, forward_task_to_member]
    note: Team(members=[...]) gives the team leader these tools to pass work to a member
  pydantic-ai:
    exact: [final_result]
    prefix: [final_result_]
    note: structured-output tool when output_type is set
  claude-agent-sdk:
    note: built-in tools, allowed by name in allowed_tools= / tools=; they run in the SDK's own process. The CLI offers
      every built-in on the wire, permission-gated by allowed_tools; one the code allows is a declared tool (builtin
      below), the rest are the framework's
    exact: [Agent, Task, Bash, BashOutput, KillShell, KillBash, Write, Edit, MultiEdit, NotebookEdit, Read, Glob, Grep,
      WebFetch, WebSearch, TodoWrite, ExitPlanMode, EnterPlanMode, SlashCommand, Skill, ListMcpResources,
      ReadMcpResource, AskUserQuestion, ListAgents, SendMessage, ReportFindings, ScheduleWakeup, Monitor, Workflow,
      CronCreate, CronDelete, CronList, EnterWorktree, ExitWorktree, TaskCreate, TaskGet, TaskList, TaskStop,
      TaskUpdate, TaskOutput, ToolSearch, DeferredToolPlaceholder, LS, NotebookRead]
    # capability: what the tool can do, so `prohibited` and `role_boundary` can name the ability and not the spelling
    builtin:
      Read: {effect: read}
      Glob: {effect: read}
      Grep: {effect: read}
      WebFetch: {effect: read}
      WebSearch: {effect: read}
      ListMcpResources: {effect: read}
      ReadMcpResource: {effect: read}
      TodoWrite: {effect: read}
      Task: {effect: read}
      Skill: {effect: read}
      SlashCommand: {effect: read}
      ExitPlanMode: {effect: read}
      Write: {effect: write, capability: file_write}
      Edit: {effect: write, capability: file_write}
      MultiEdit: {effect: write, capability: file_write}
      NotebookEdit: {effect: write, capability: file_write}
      Bash: {effect: write, capability: shell_execution}
      BashOutput: {effect: read}
      KillShell: {effect: write, capability: shell_execution}
# the words a spec may use for a capability
capability_names:
  shell_execution: shell_execution
  shell: shell_execution
  run_shell: shell_execution
  command_execution: shell_execution
  file_write: file_write
  file_writes: file_write
  write_files: file_write
