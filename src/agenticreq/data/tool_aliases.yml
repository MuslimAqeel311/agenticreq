# The same tool under a different wire name. Providers serve hosted tools under a prefix or a dated name; every
# comparison of tool names goes through names.norm, so an entry here makes the two spellings one tool everywhere.
version: 1
prefixes: ["hosted:", "server:"]
#: frameworks that send <plugin><separator><function> on the wire: the function is the tool
plugin_separator:
  semantic-kernel: "-"
aliases:
  web_search_preview: web_search
  web_search_20250305: web_search
  code_execution_20250522: code_execution
  file_search_tool: file_search
