# How a mock run recognises and answers a model request. The parent reads this file and hands it to the run (the
# agent's environment needs no YAML reader). A new provider with a known wire format needs a line here.
version: 1
#: wire formats, first match wins: the path of the request says which it is, whatever the host
formats:
  - {name: openai_chat, path_end: /chat/completions}
  - {name: openai_responses, path_end: /responses}
  - {name: anthropic, path_end: /messages, body_has: messages}
  - {name: gemini, path_regex: '/models/[^/:]+:(streamGenerateContent|generateContent)$'}
#: hosts that speak the OpenAI chat format, for reports and the socket guard's list of model hosts
openai_compatible_hosts:
  - api.groq.com          # Groq
  - api.mistral.ai        # Mistral
  - openrouter.ai         # OpenRouter
  - openai.azure.com      # Azure OpenAI: *.openai.azure.com/openai/deployments/<name>/chat/completions
  - litellm               # a LiteLLM proxy is any host, on the same path
#: what cannot be intercepted at the HTTP client layer: the items go to Human sign-off, and the run does not fail
unsupported:
  hosts:
    - {match: bedrock-runtime, name: AWS Bedrock (signed botocore transport)}
    - {match: aiplatform.googleapis.com, name: Vertex AI (gRPC)}
  frameworks:
    claude_agent_sdk: Claude Agent SDK (runs the Claude CLI in its own process)
#: headers a model request may carry a trace id in (data/tracing.yml describes the mechanisms)
trace_headers: [traceparent, x-trace-id, x-correlation-id]
#: SDKs that refuse to start without these get a dummy value inside the run only; it is never printed
credential_env:
  - XAI_API_KEY
  - DEEPSEEK_API_KEY
  - FIREWORKS_API_KEY
  - PERPLEXITY_API_KEY
  - LITELLM_API_KEY
  - AZURE_API_KEY
  - GOOGLE_GENAI_API_KEY
env_defaults:
  AZURE_OPENAI_ENDPOINT: https://mock-run.openai.azure.com
  OPENAI_API_VERSION: "2024-10-21"
