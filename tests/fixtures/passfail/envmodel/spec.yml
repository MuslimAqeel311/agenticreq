agent_id: support-agent
risk_level: low
goal:
  statement: Answer order-status questions
  done_criteria: [order status returned to the customer]
out_of_scope: [refunds]
role_boundary:
  allowed_tools: [lookup_order]
prohibited:
  - {tool: issue_refund, reason: support never moves money}
approval_required: []
limits: []
escalation:
  - {metric: risk_score, op: ">=", threshold: 8, to: support-lead}
untrusted_inputs: []
owner: owner@example.com
technical_owner: eng@example.com
data_rules: {}
progress_guard: {max_no_progress_steps: 5}
