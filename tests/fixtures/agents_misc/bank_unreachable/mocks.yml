entry: agent.py:run
args: {task: "What is my balance?"}
python:
order: [transfer_to_accounts, transfer_to_fraud, get_balances, flag_transaction, audit_log]
tools:
  get_balances: {args: {customer_id: c1}}
  flag_transaction: {args: {txn_id: t1}}
  audit_log: {args: {entry: e1}}
runs:
  - name: accounts
    args: {task: "What is my balance?"}
    order: [transfer_to_accounts, get_balances]
  - name: fraud
    args: {task: "I see a charge I do not recognise"}
    order: [transfer_to_fraud, flag_transaction]
