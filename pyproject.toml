[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agenticreq"
dynamic = ["version"]  # single source: __version__ in src/agenticreq/__init__.py
description = "Checks whether an agentic AI system's declared requirements are enforced in its code, with measured confidence and without any LLM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Muslim Bin Aqeel", email = "muslimarain321@gmail.com" }]
keywords = [
  "ai-agents", "agentic", "requirements", "specification", "static-analysis",
  "ast", "compliance", "guardrails", "sarif", "llm-safety",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Lower bounds are the oldest versions the test suite passes on (Python 3.10). Nothing is pinned from above.
dependencies = [
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "rich>=13.0",
  "typer>=0.15.4",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# the mock run hooks httpx / httpx2 inside the agent's own environment; this extra is only for running the tests
capture = ["httpx>=0.25"]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.25",
  "httpx2>=2.0",
  "cedarpy>=4.0",  # used by tests/test_export_types.py (skipped when absent)
]
dev = [
  "agenticreq[test]",
  "mypy>=1.8",
  "types-PyYAML",
  "ruff>=0.6",
  "build>=1.0",
  "twine>=5.0",
  "pip-audit>=2.7",
  "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/MuslimAqeel311/agenticreq"
Documentation = "https://github.com/MuslimAqeel311/agenticreq/tree/main/docs"
Repository = "https://github.com/MuslimAqeel311/agenticreq"
Issues = "https://github.com/MuslimAqeel311/agenticreq/issues"
Changelog = "https://github.com/MuslimAqeel311/agenticreq/blob/main/CHANGELOG.md"

[project.scripts]
agenticreq = "agenticreq.cli:app"

[project.entry-points."agenticreq.recognizers"]
langgraph = "agenticreq.recognizers.langgraph:LangGraphRecognizer"

[tool.hatch.version]
path = "src/agenticreq/__init__.py"

[tool.hatch.build.targets.sdist]
# only what a user or packager needs; scratch files (ac.py), validation corpora and caches stay out
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/CODE_OF_CONDUCT.md",
  "/pyproject.toml",
  "/action.yml",
  "/spec.schema.json",
]
exclude = ["__pycache__", "*.pyc", ".agenticreq"]

[tool.hatch.build.targets.wheel]
# everything under the package ships: py.typed, data/*.yml, defaults/profiles/*.yml, spec.schema.json
packages = ["src/agenticreq"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/agenticreq"]

[[tool.mypy.overrides]]
module = ["httpx2", "httpx2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agenticreq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
# fixtures are sample agent code that agenticreq scans (their line numbers are asserted); validation/ is a research corpus
extend-exclude = ["tests/fixtures", "validation"]

[tool.ruff.lint]
# Correctness and whitespace only. Import sorting is left out on purpose: rule modules register on import.
select = ["E4", "E7", "E9", "F", "W"]

[tool.ruff.format]
quote-style = "double"
